<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Murmuration Camera</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b7280;
    --accent: #178a3a;
    --panel: rgba(255,255,255,0.82);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
  canvas#scene { display: block; width: 100%; height: 100%; background: #fff; }

  /* Hidden work surfaces */
  video, canvas#mask { display: none; }

  /* HUD */
  #badge {
    position: fixed; left: 16px; bottom: 16px;
    font-weight: 700; letter-spacing: .04em; font-size: 15px;
    color: var(--muted);
    padding: 6px 12px; border-radius: 999px;
    background: var(--panel); backdrop-filter: blur(6px);
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  #badge.forming { color: #fff; background: var(--accent); }

  #stats {
    position: fixed; left: 16px; top: 14px;
    font-size: 12.5px; color: var(--muted);
    background: var(--panel); backdrop-filter: blur(6px);
    padding: 6px 10px; border-radius: 8px;
  }

  #panel {
    position: fixed; right: 16px; top: 14px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--panel); backdrop-filter: blur(6px);
    padding: 8px 10px; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  #panel button, #panel label {
    font-size: 12.5px; color: var(--ink);
    background: #fff; border: 1px solid #e5e7eb; border-radius: 7px;
    padding: 6px 9px; cursor: pointer; user-select: none;
  }
  #panel button:hover { border-color: #cbd5e1; }
  #panel label { display: flex; align-items: center; gap: 6px; cursor: default; }
  #panel input[type=range] { width: 90px; }

  /* Preview thumbnail */
  #preview {
    position: fixed; right: 16px; bottom: 16px;
    width: 220px; border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); display: none;
    border: 2px solid #fff; background:#000;
  }
  #preview.show { display: block; }
  #preview canvas { display: block; width: 100%; }

  /* Start / status overlay */
  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(255,255,255,.94); z-index: 10; text-align: center; padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 460px; }
  #overlay h1 { font-size: 26px; margin: 0 0 8px; }
  #overlay p { color: var(--muted); line-height: 1.5; margin: 8px 0 20px; }
  #start {
    font-size: 16px; font-weight: 600; color: #fff; background: var(--ink);
    border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer;
  }
  #start:hover { background: #000; }
  #err { color: #b91c1c; font-size: 13px; margin-top: 14px; min-height: 18px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>
  </div>

  <div id="stats">starting…</div>
  <div id="badge">FREE FLIGHT</div>

  <div id="panel">
    <button id="pause">Pause</button>
    <button id="form">Formation: on</button>
    <button id="prev">Preview</button>
    <label>Birds <input id="count" type="range" min="80" max="1400" step="20" value="800"></label>
  </div>

  <div id="preview"><canvas id="pvcanvas"></canvas></div>

  <video id="video" playsinline muted></video>
  <canvas id="mask"></canvas>

  <div id="overlay">
    <div class="card">
      <h1>Murmuration Camera</h1>
      <p>A flock of birds murmurates on a white screen. Step in front of your
         camera and the swarm reorganises into your silhouette.</p>
      <button id="start">Enable camera &amp; start</button>
      <div id="err"></div>
      <div class="hint">Everything runs in your browser — the camera feed never leaves this page.</div>
    </div>
  </div>

<!-- MediaPipe Selfie Segmentation (client-side human silhouette) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<script>
"use strict";
(function () {
  // ---------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------
  const scene   = document.getElementById("scene");
  const ctx     = scene.getContext("2d");
  const video   = document.getElementById("video");
  const maskCv  = document.getElementById("mask");
  const maskCtx = maskCv.getContext("2d", { willReadFrequently: true });
  const pvCv    = document.getElementById("pvcanvas");
  const pvCtx   = pvCv.getContext("2d");
  const badge   = document.getElementById("badge");
  const stats   = document.getElementById("stats");
  const overlay = document.getElementById("overlay");
  const errEl   = document.getElementById("err");

  const MW = 256, MH = 256;          // mask working resolution
  maskCv.width = MW; maskCv.height = MH;

  // ---------------------------------------------------------------
  // Flock (Reynolds boids) in typed arrays
  // ---------------------------------------------------------------
  const Flock = {
    n: 0,
    px: null, py: null, vx: null, vy: null,
    blend: 0,
    formationOn: true,
    W: 0, H: 0,
    // Silhouette distance field: field[my*fieldW+mx] = distance (in mask px)
    // OUTSIDE the human shape, 0 inside.  Birds outside feel a soft inward
    // pull that grows with this distance -- a magnet, not a wall.
    field: null, fieldW: 0, fieldH: 0,

    // tuning
    sepR: 13, alignR: 55, cohR: 70,  // spread to fill, wide alignment = flowing
    sepW: 0.9, alignW: 0.85, cohW: 0.32,
    maxSpeed: 5.2, maxForce: 0.55,   // fast, with strong steering = tight turns
    cruiseSpeed: 3.6,                // birds fly at a brisk steady pace
    damping: 0.99,                   // bleeds off twitchy accelerations
    edgeMargin: 34,                  // free-cross band (px) outside the edge: no pull here
    magK: 0.008,                     // inward pull per sim-px BEYOND the margin
    maxPull: 0.38,                   // cap on that pull (deep outside)

    init(n, W, H) {
      this.W = W; this.H = H;
      this.n = n;
      this.px = new Float32Array(n); this.py = new Float32Array(n);
      this.vx = new Float32Array(n); this.vy = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        this.px[i] = W * (0.2 + 0.6 * Math.random());
        this.py[i] = H * (0.2 + 0.6 * Math.random());
        const a = Math.random() * Math.PI * 2;
        this.vx[i] = Math.cos(a) * 3; this.vy[i] = Math.sin(a) * 3;
      }
      this.blend = 0;
    },

    setCount(n) {
      if (n === this.n) return;
      const on = this.formationOn;
      this.init(n, this.W, this.H);
      this.formationOn = on;
    },

    resize(W, H) { this.W = W; this.H = H; },

    // Give the flock the silhouette as a distance field (0 inside, growing
    // with distance outside).  Birds fly freely; those outside feel a soft
    // inward pull that scales with the distance -- a magnet, not a wall.
    setField(field, w, h) {
      this.field = field || null; this.fieldW = w; this.fieldH = h;
    },

    // Distance (mask px) outside the silhouette at simulation coords (x, y);
    // 0 means inside.  Returns 0 when no field is set.
    distAt(x, y) {
      if (!this.field) return 0;
      const mx = (x * this.fieldW / this.W) | 0;
      const my = (y * this.fieldH / this.H) | 0;
      if (mx < 0 || mx >= this.fieldW || my < 0 || my >= this.fieldH) return 1e4;
      return this.field[my * this.fieldW + mx];
    },

    // Convenience: is a bird inside the shape?
    inside(x, y) { return this.field != null && this.distAt(x, y) === 0; },

    step() {
      const n = this.n;
      const px = this.px, py = this.py, vx = this.vx, vy = this.vy;
      const sepR2 = this.sepR * this.sepR;
      const alignR2 = this.alignR * this.alignR;
      const cohR2 = this.cohR * this.cohR;

      const want = (this.formationOn && this.field) ? 1 : 0;
      this.blend += (want - this.blend) * 0.05;   // slow, smooth assemble/dissolve
      const blend = this.blend;
      const contained = blend > 0.01 && this.field;

      for (let i = 0; i < n; i++) {
        let sepx = 0, sepy = 0;
        let avx = 0, avy = 0, ac = 0;
        let cx = 0, cy = 0, cc = 0;
        const xi = px[i], yi = py[i];

        for (let j = 0; j < n; j++) {
          if (j === i) continue;
          const dx = xi - px[j], dy = yi - py[j];
          const d2 = dx * dx + dy * dy;
          if (d2 > cohR2) continue;
          if (d2 < sepR2 && d2 > 0.0001) { sepx += dx / d2; sepy += dy / d2; }
          if (d2 < alignR2) { avx += vx[j]; avy += vy[j]; ac++; }
          cx += px[j]; cy += py[j]; cc++;
        }

        // Separation always applies -- it's what spreads the birds so they
        // FILL the silhouette evenly instead of piling onto a few points.
        let ax = clampMag(sepx, sepy, this.maxForce)[0] * this.sepW;
        let ay = clampMag(sepx, sepy, this.maxForce)[1] * this.sepW;

        // Alignment + a little cohesion keep the flock flowing in coherent
        // groups, so bands of birds bulge across the boundary together and get
        // drawn back in -- the magnet look.
        if (ac > 0) {
          const al = clampMag(avx / ac - vx[i], avy / ac - vy[i], this.maxForce);
          ax += al[0] * this.alignW; ay += al[1] * this.alignW;
        }
        if (cc > 0) {
          const cohW = contained ? this.cohW * 0.4 : this.cohW;
          const co = clampMag(cx / cc - xi, cy / cc - yi, this.maxForce);
          ax += co[0] * cohW; ay += co[1] * cohW;
        }

        // A little wandering keeps the motion lively and lets birds explore
        // across the boundary rather than settling.
        if (contained) {
          ax += (Math.random() - 0.5) * 0.35;
          ay += (Math.random() - 0.5) * 0.35;
        }

        // MAGNET: soft inward pull that GROWS with how far a bird is outside
        // the silhouette.  Near the edge it is gentle (birds drift out and
        // overlap the boundary); the farther out they wander, the harder they
        // are drawn back -- so they cross the edge and curve home, no hard wall.
        if (contained) {
          const mx = (xi * this.fieldW / this.W) | 0;
          const my = (yi * this.fieldH / this.H) | 0;
          if (mx >= 0 && mx < this.fieldW && my >= 0 && my < this.fieldH) {
            const idx = my * this.fieldW + mx;
            const d = this.field[idx];
            if (d > 0) {
              // inward = down the distance gradient (toward smaller distance)
              const l = mx > 0 ? this.field[idx - 1] : d;
              const r = mx < this.fieldW - 1 ? this.field[idx + 1] : d;
              const u = my > 0 ? this.field[idx - this.fieldW] : d;
              const dn = my < this.fieldH - 1 ? this.field[idx + this.fieldW] : d;
              const simD = d * this.W / this.fieldW;            // px outside
              // No pull within the free-cross band -> the perimeter is fully
              // permeable; birds only feel the magnet once well past the edge.
              if (simD > this.edgeMargin) {
                let gx = l - r, gy = u - dn;
                const gl = Math.hypot(gx, gy) || 1e-6; gx /= gl; gy /= gl;
                const pull = Math.min(this.maxPull, this.magK * (simD - this.edgeMargin)) * blend;
                ax += gx * pull; ay += gy * pull;
              }
            }
          }
        }

        vx[i] += ax; vy[i] += ay;
        vx[i] *= this.damping; vy[i] *= this.damping;   // smooth, glide-y motion

        // Keep a steady cruising speed at all times so birds always glide and
        // fly around -- inside the shape too -- rather than freezing.
        let sp = Math.hypot(vx[i], vy[i]);
        if (sp > this.maxSpeed) {
          vx[i] = vx[i] / sp * this.maxSpeed; vy[i] = vy[i] / sp * this.maxSpeed;
        } else {
          if (sp < 1e-3) { const a = Math.random() * 6.2832; vx[i] = Math.cos(a); vy[i] = Math.sin(a); sp = 1; }
          const ns = sp + (this.cruiseSpeed - sp) * 0.12;
          vx[i] = vx[i] / sp * ns; vy[i] = vy[i] / sp * ns;
        }
      }

      // integrate + wrap
      const W = this.W, H = this.H, m = 8;
      for (let i = 0; i < n; i++) {
        px[i] += vx[i]; py[i] += vy[i];
        if (px[i] < -m) px[i] = W + m; else if (px[i] > W + m) px[i] = -m;
        if (py[i] < -m) py[i] = H + m; else if (py[i] > H + m) py[i] = -m;
      }
    },

    draw(g) {
      const n = this.n, forming = this.formationOn && this.field;
      g.fillStyle = forming ? "#202020" : "#3c3c3c";
      const r = 4.2, TAU = Math.PI * 2;   // doubled circle size
      g.beginPath();
      for (let i = 0; i < n; i++) {
        const x = this.px[i], y = this.py[i];
        g.moveTo(x + r, y);
        g.arc(x, y, r, 0, TAU);
      }
      g.fill();
    }
  };

  const _cm = [0, 0];
  function clampMag(x, y, max) {
    const m = Math.hypot(x, y);
    if (m > max && m > 0) { _cm[0] = x / m * max; _cm[1] = y / m * max; }
    else { _cm[0] = x; _cm[1] = y; }
    return _cm;
  }

  // ---------------------------------------------------------------
  // Silhouette -> distance field (0 inside, growing with distance outside).
  // A 2-pass chamfer transform gives a cheap approximate Euclidean distance,
  // which the flock uses as a soft magnetic well around the shape.
  // ---------------------------------------------------------------
  let coverage = 0;

  function buildField() {
    const img = maskCtx.getImageData(0, 0, MW, MH).data;
    const INF = 1e9;
    const d = new Float32Array(MW * MH);
    let cnt = 0;
    for (let i = 0; i < MW * MH; i++) {
      if (img[i * 4] > 128) { d[i] = 0; cnt++; }   // inside person
      else d[i] = INF;
    }
    coverage = cnt / (MW * MH);
    if (coverage < 0.01) return null;

    const A = 1, B = 1.4142136;
    // forward pass
    for (let y = 0; y < MH; y++) {
      for (let x = 0; x < MW; x++) {
        const i = y * MW + x; let v = d[i];
        if (x > 0) v = Math.min(v, d[i - 1] + A);
        if (y > 0) v = Math.min(v, d[i - MW] + A);
        if (x > 0 && y > 0) v = Math.min(v, d[i - MW - 1] + B);
        if (x < MW - 1 && y > 0) v = Math.min(v, d[i - MW + 1] + B);
        d[i] = v;
      }
    }
    // backward pass
    for (let y = MH - 1; y >= 0; y--) {
      for (let x = MW - 1; x >= 0; x--) {
        const i = y * MW + x; let v = d[i];
        if (x < MW - 1) v = Math.min(v, d[i + 1] + A);
        if (y < MH - 1) v = Math.min(v, d[i + MW] + A);
        if (x < MW - 1 && y < MH - 1) v = Math.min(v, d[i + MW + 1] + B);
        if (x > 0 && y < MH - 1) v = Math.min(v, d[i + MW - 1] + B);
        d[i] = v;
      }
    }
    return { field: d, w: MW, h: MH };
  }

  // ---------------------------------------------------------------
  // Rendering loop
  // ---------------------------------------------------------------
  let paused = false, showPreview = false, frame = 0;
  let fps = 0, lastT = performance.now();

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    scene.width = Math.floor(window.innerWidth * dpr);
    scene.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    Flock.resize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener("resize", resize);

  function render() {
    requestAnimationFrame(render);
    const now = performance.now();
    const dt = now - lastT; lastT = now;
    if (dt > 0) fps = fps * 0.9 + (1000 / dt) * 0.1;

    if (!paused) Flock.step();

    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    Flock.draw(ctx);

    const forming = Flock.formationOn && Flock.field;
    badge.textContent = forming ? "FORMING SILHOUETTE" : "FREE FLIGHT";
    badge.classList.toggle("forming", forming);
    stats.textContent = `birds ${Flock.n} · ${fps.toFixed(0)} fps · body ${(coverage * 100).toFixed(0)}%`;
    frame++;
  }

  // ---------------------------------------------------------------
  // MediaPipe results -> mask canvas
  // ---------------------------------------------------------------
  function onResults(res) {
    // Draw the segmentation mask (white person on black) into maskCv.
    maskCtx.save();
    maskCtx.clearRect(0, 0, MW, MH);
    maskCtx.fillStyle = "#000";
    maskCtx.fillRect(0, 0, MW, MH);
    if (res.segmentationMask) {
      maskCtx.drawImage(res.segmentationMask, 0, 0, MW, MH);
      // Threshold to hard white where person, using multiply against white.
      // (drawImage already yields high alpha/white on person, dark elsewhere.)
    }
    maskCtx.restore();

    // Refresh the silhouette distance field ~4x/second (responsive to
    // movement, cheap enough not to hitch).
    if (frame % 15 === 0) {
      const o = buildField();
      if (o) Flock.setField(o.field, o.w, o.h);
      else Flock.setField(null);
    }

    if (showPreview) {
      pvCv.width = 220; pvCv.height = Math.round(220 * (video.videoHeight / video.videoWidth || 0.75));
      pvCtx.drawImage(video, 0, 0, pvCv.width, pvCv.height);
      pvCtx.globalAlpha = 0.45; pvCtx.drawImage(maskCv, 0, 0, pvCv.width, pvCv.height);
      pvCtx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  async function start() {
    errEl.textContent = "";
    if (typeof SelfieSegmentation === "undefined") {
      errEl.textContent = "Could not load the segmentation library (offline or blocked). This page must be served over the web, not opened as a sandboxed file.";
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
    } catch (e) {
      errEl.textContent = "Camera access was denied or unavailable. Allow the camera and reload. (The camera needs an https:// page.)";
      return;
    }

    video.srcObject = stream;
    await video.play();

    resize();
    Flock.init(parseInt(document.getElementById("count").value, 10), Flock.W, Flock.H);

    const seg = new SelfieSegmentation({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
    });
    seg.setOptions({ modelSelection: 1, selfieMode: true });
    seg.onResults(onResults);

    // Pump frames to MediaPipe.
    async function pump() {
      if (video.readyState >= 2) {
        try { await seg.send({ image: video }); } catch (e) { /* transient */ }
      }
      requestAnimationFrame(pump);
    }
    pump();
    render();

    overlay.classList.add("hidden");
  }

  // ---------------------------------------------------------------
  // Controls
  // ---------------------------------------------------------------
  document.getElementById("start").addEventListener("click", start);
  document.getElementById("pause").addEventListener("click", (e) => {
    paused = !paused; e.target.textContent = paused ? "Resume" : "Pause";
  });
  document.getElementById("form").addEventListener("click", (e) => {
    Flock.formationOn = !Flock.formationOn;
    e.target.textContent = "Formation: " + (Flock.formationOn ? "on" : "off");
  });
  document.getElementById("prev").addEventListener("click", () => {
    showPreview = !showPreview;
    document.getElementById("preview").classList.toggle("show", showPreview);
  });
  document.getElementById("count").addEventListener("input", (e) => {
    Flock.setCount(parseInt(e.target.value, 10));
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === " ") { document.getElementById("pause").click(); e.preventDefault(); }
    else if (e.key === "f") document.getElementById("form").click();
    else if (e.key === "m") document.getElementById("prev").click();
  });

  // Draw a gentle idle flock behind the overlay so the page isn't blank.
  resize();
  Flock.init(500, Flock.W, Flock.H);
  (function idle() {
    if (!overlay.classList.contains("hidden")) {
      Flock.step();
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      Flock.draw(ctx);
      requestAnimationFrame(idle);
    }
  })();
})();
</script>
</body>
</html>
